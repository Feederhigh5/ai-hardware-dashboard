<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>KI-Hosting · Hardware-Dashboard 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c10;
  --bg-panel: #0f1218;
  --surface: #161a23;
  --surface-2: #1d2230;
  --surface-3: #242a3a;
  --border: #262c3a;
  --border-strong: #3a4256;
  --text-primary: #e9ebf2;
  --text-secondary: #9098a8;
  --text-tertiary: #5d6477;
  --accent: #7aa2ff;
  --accent-dim: #3d5a99;
  --accent-bg: rgba(122, 162, 255, 0.08);
  --ok: #4dd081;
  --ok-bg: rgba(77, 208, 129, 0.10);
  --usable: #d4b550;
  --usable-bg: rgba(212, 181, 80, 0.10);
  --warn: #d18158;
  --warn-bg: rgba(209, 129, 88, 0.10);
  --err: #d8556a;
  --err-bg: rgba(216, 85, 106, 0.10);
  --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; }
.mono { font-family: var(--font-mono); font-feature-settings: 'tnum' 1; }
.num { font-family: var(--font-mono); font-feature-settings: 'tnum' 1; font-variant-numeric: tabular-nums; }

/* Page layout */
.page { max-width: 1440px; margin: 0 auto; padding: 0 32px 64px; }

/* Header */
.app-header {
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #0d1017 0%, var(--bg) 100%);
  padding: 28px 32px 24px;
  margin-bottom: 24px;
}
.app-header-inner { max-width: 1376px; margin: 0 auto; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.eyebrow::before {
  content: '';
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 8px var(--ok);
}
.app-title {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
  color: var(--text-primary);
}
.app-subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  max-width: 760px;
}

/* Top control bar — sticky */
.control-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(10, 12, 16, 0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 12px 32px;
  margin: 0 -32px 24px;
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}
.control-group {
  display: flex;
  align-items: center;
  gap: 10px;
}
.control-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}
.control-value {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-primary);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 10px;
  min-width: 64px;
  text-align: right;
}
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 110px;
  height: 4px;
  background: var(--surface-2);
  border-radius: 2px;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px; height: 14px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 0 3px rgba(122, 162, 255, 0.18);
}
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  border: none;
  box-shadow: 0 0 0 3px rgba(122, 162, 255, 0.18);
}

.divider { width: 1px; height: 24px; background: var(--border); }

/* Section */
.section {
  margin-bottom: 40px;
}
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 24px;
}
.section-num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-tertiary);
  letter-spacing: 0.12em;
  margin-right: 12px;
}
.section-title {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.01em;
  display: inline;
}
.section-sub {
  font-size: 13px;
  color: var(--text-secondary);
  max-width: 480px;
  text-align: right;
}

/* KPI Cards */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.kpi-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 10px;
}
.kpi-value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  line-height: 1.1;
}
.kpi-unit { font-size: 13px; color: var(--text-secondary); margin-left: 2px; }
.kpi-detail {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 6px;
}
.kpi-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  background: var(--accent);
  width: 100%;
  opacity: 0.4;
}

/* Compatibility matrix */
.matrix-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
  overflow-x: auto;
}
.matrix {
  display: grid;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 4px;
  min-width: 1100px;
}
.matrix-row { display: contents; }
.cell {
  background: var(--surface-2);
  padding: 8px 10px;
  font-size: 11px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 64px;
  position: relative;
  cursor: pointer;
  transition: background 0.12s;
}
.cell:hover { background: var(--surface-3); }
.cell.header-corner {
  background: var(--surface);
  cursor: default;
}
.cell.header-row, .cell.header-col {
  background: var(--surface);
  cursor: pointer;
}
.cell.header-row:hover, .cell.header-col:hover {
  background: var(--surface-2);
}
.cell.header-row {
  padding: 12px 14px;
}
.cell.header-col {
  padding: 10px 8px;
  align-items: flex-start;
}
.cell.selected-axis {
  background: var(--accent-bg);
}
.hw-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 2px;
}
.hw-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-tertiary);
  letter-spacing: 0.04em;
}
.model-name {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: -0.005em;
  line-height: 1.25;
  margin-bottom: 3px;
}
.model-meta {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--text-tertiary);
  letter-spacing: 0.02em;
}

/* Cell status colors */
.cell-status-ideal {
  background: linear-gradient(180deg, rgba(77, 208, 129, 0.13), rgba(77, 208, 129, 0.05));
  border-left: 2px solid var(--ok);
}
.cell-status-usable {
  background: linear-gradient(180deg, rgba(212, 181, 80, 0.10), rgba(212, 181, 80, 0.03));
  border-left: 2px solid var(--usable);
}
.cell-status-slow {
  background: linear-gradient(180deg, rgba(209, 129, 88, 0.10), rgba(209, 129, 88, 0.03));
  border-left: 2px solid var(--warn);
}
.cell-status-oom {
  background: repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 6px, rgba(216, 85, 106, 0.08) 6px, rgba(216, 85, 106, 0.08) 12px);
  border-left: 2px solid var(--err);
  opacity: 0.7;
}
.cell-tps {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.cell-tps-unit { font-size: 9.5px; color: var(--text-tertiary); margin-left: 2px; font-weight: 400; }
.cell-prefill {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-secondary);
  margin-top: 2px;
}
.cell-status-oom .cell-tps { color: var(--err); font-size: 11px; }
.cell-status-slow .cell-tps { color: var(--warn); }
.cell-status-usable .cell-tps { color: var(--usable); }
.cell-status-ideal .cell-tps { color: var(--ok); }

/* Legend */
.legend {
  display: flex;
  gap: 20px;
  margin-top: 14px;
  font-size: 11px;
  color: var(--text-secondary);
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-swatch { width: 12px; height: 12px; border-radius: 2px; border-left: 2px solid; }
.legend-swatch.ideal { background: rgba(77, 208, 129, 0.15); border-left-color: var(--ok); }
.legend-swatch.usable { background: rgba(212, 181, 80, 0.13); border-left-color: var(--usable); }
.legend-swatch.slow { background: rgba(209, 129, 88, 0.13); border-left-color: var(--warn); }
.legend-swatch.oom {
  background: repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 3px, rgba(216, 85, 106, 0.2) 3px, rgba(216, 85, 106, 0.2) 6px);
  border-left-color: var(--err);
}

/* Detail panel */
.detail-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 18px 20px;
  margin-top: 12px;
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 24px;
}
.detail-empty {
  text-align: center;
  padding: 28px 0;
  color: var(--text-tertiary);
  font-size: 12px;
  font-family: var(--font-mono);
  letter-spacing: 0.03em;
}
.detail-section h4 {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 10px;
  font-weight: 500;
}
.detail-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.detail-row:last-child { border-bottom: none; }
.detail-key { color: var(--text-secondary); }
.detail-val { font-family: var(--font-mono); color: var(--text-primary); }
.verdict-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 3px;
  letter-spacing: 0.04em;
}
.verdict-tag.ideal { background: var(--ok-bg); color: var(--ok); }
.verdict-tag.usable { background: var(--usable-bg); color: var(--usable); }
.verdict-tag.slow { background: var(--warn-bg); color: var(--warn); }
.verdict-tag.oom { background: var(--err-bg); color: var(--err); }
.verdict-tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* Bar (mini) */
.mini-bar {
  height: 4px;
  background: var(--surface-2);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}
.mini-bar-fill {
  height: 100%;
  border-radius: 2px;
}

/* Design space chart */
.scatter-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 24px 28px;
}
.scatter-svg { width: 100%; height: 520px; display: block; }
.scatter-axis line { stroke: var(--border); stroke-width: 1; }
.scatter-axis text {
  fill: var(--text-tertiary);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
}
.scatter-grid line { stroke: var(--border); stroke-width: 0.5; stroke-dasharray: 2 3; }
.hw-zone {
  fill-opacity: 0.06;
  stroke-width: 1;
  stroke-dasharray: 4 3;
  cursor: pointer;
  transition: fill-opacity 0.2s;
}
.hw-zone:hover, .hw-zone.active { fill-opacity: 0.18; stroke-dasharray: none; }
.hw-zone-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  pointer-events: none;
}
.model-dot {
  cursor: pointer;
  transition: r 0.2s;
}
.model-dot:hover { stroke-width: 2; }
.model-label {
  font-family: var(--font-sans);
  font-size: 10.5px;
  font-weight: 500;
  fill: var(--text-primary);
  pointer-events: none;
}

/* TCO chart */
.tco-grid {
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 16px;
}
.tco-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 22px 24px;
}
.tco-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }
.tco-chart-svg { width: 100%; height: 360px; display: block; }

.tco-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.tco-table th {
  text-align: left;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  font-weight: 500;
  padding: 8px 10px 8px 0;
  border-bottom: 1px solid var(--border);
}
.tco-table td {
  padding: 10px 10px 10px 0;
  border-bottom: 1px solid var(--border);
}
.tco-table tr:last-child td { border-bottom: none; }
.tco-table .num { text-align: right; }
.tco-table tr.active { background: var(--accent-bg); }

/* Hardware cards */
.hw-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.hw-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 18px 20px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
  position: relative;
  overflow: hidden;
}
.hw-card:hover { border-color: var(--border-strong); }
.hw-card.active { border-color: var(--accent); }
.hw-card-name {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2px;
}
.hw-card-cat {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-tertiary);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.spec-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 16px;
  margin-bottom: 12px;
}
.spec-row {}
.spec-key {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 1px;
}
.spec-val {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
}
.spec-val .unit {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 400;
  margin-left: 2px;
}
.hw-card-foot {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-secondary);
}
.hw-card-foot .num { color: var(--text-primary); font-size: 12px; }
.hw-fits {
  display: flex;
  gap: 3px;
  margin-bottom: 12px;
}
.hw-fit-pip {
  flex: 1;
  height: 4px;
  border-radius: 1px;
}
.hw-fit-pip.ideal { background: var(--ok); }
.hw-fit-pip.usable { background: var(--usable); }
.hw-fit-pip.slow { background: var(--warn); }
.hw-fit-pip.oom { background: var(--surface-3); }

/* Footer */
.footer {
  margin-top: 56px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.footer-meta { display: flex; gap: 24px; flex-wrap: wrap; }

.tooltip {
  position: fixed;
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  padding: 10px 12px;
  font-size: 11px;
  pointer-events: none;
  z-index: 1000;
  max-width: 260px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  font-family: var(--font-mono);
  line-height: 1.5;
}
.tooltip-title { color: var(--text-primary); font-weight: 500; margin-bottom: 4px; }
.tooltip-row { color: var(--text-secondary); }
.tooltip-row .num { color: var(--text-primary); }

/* Methodology */
.methodology {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 18px 22px;
  font-size: 11.5px;
  color: var(--text-secondary);
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.methodology-block h5 {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-primary);
  margin-bottom: 8px;
  font-weight: 600;
}
.formula {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--surface);
  padding: 6px 8px;
  border-radius: 3px;
  color: var(--text-primary);
  margin: 4px 0 6px;
  display: block;
}
</style>
</head>

    <h1 class="app-title">KI-Hosting · Hardware-Dashboard 2026</h1>

/* --------- Compatibility maths --------- */
function computeFit(hw, m) {
  const fitsVRAM = hw.vram >= m.vram;
  // Memory-bandwidth-bound TPS for token generation
  const tps = hw.bandwidth / (m.active * 0.5);
  // Prefill (32k tokens) time in seconds; <10 s = goal
  const prefillSec = 10 * (m.computeNeed / hw.tflops);

  let status, label;
  if (!fitsVRAM) { status = 'oom'; label = 'OOM'; }
  else if (tps < 10) { status = 'slow'; label = 'Zu langsam'; }
  else if (tps >= 30 && prefillSec <= 10) { status = 'ideal'; label = 'Ideal'; }
  else if (tps >= 30 && prefillSec <= 30) { status = 'usable'; label = 'Brauchbar'; }
  else if (tps >= 15) { status = 'usable'; label = 'Brauchbar'; }
  else { status = 'slow'; label = 'Zu langsam'; }

  return { fitsVRAM, tps, prefillSec, status, label };
}

/* Monthly electricity cost in EUR */
function monthlyEnergy(hw, params) {
  // Linearly scale published LF=0.6 power against user-set load factor
  const power = hw.powerKI * (params.lf / 0.6);
  const kWhPerMonth = (power / 1000) * params.hoursPerDay * 30;
  return kWhPerMonth * params.kWh;
}

/* TCO over N years, including residual value */
function tco(hw, params) {
  const energy = monthlyEnergy(hw, params) * 12 * params.years;
  const residualFactor = Math.max(0, 1 - (1 - hw.resaleFactor) * (params.years / 3));
  const residual = hw.price * residualFactor;
  const net = hw.price + energy - residual;
  return { capex: hw.price, energy, residual, net };
}

            <div className="hw-card-foot">
              <div>
                <div style={{fontSize: 9.5, color: 'var(--text-tertiary)', letterSpacing: '0.08em', textTransform: 'uppercase'}}>Strom</div>
                <div className="num">{energy.toFixed(2)} €/Mon</div>
              </div>
              <div style={{textAlign: 'right'}}>
                <div style={{fontSize: 9.5, color: 'var(--text-tertiary)', letterSpacing: '0.08em', textTransform: 'uppercase'}}>TCO {params.years}J</div>
                <div className="num">{(tcoNet/1000).toFixed(2)} k€</div>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* --- Methodology footer --- */
function Methodology() {
  return (
    <div className="methodology">
      <div className="methodology-block">
        <h5>VRAM-Bedarf</h5>
        <span className="formula">Total Params × 0,5 GB (Q4) + KV-Cache (TQ)</span>
        TurboQuant spart ~75–80 % VRAM ggü. FP16-Caches. Werte beziehen sich auf den maximalen Modellkontext.
      </div>
      <div className="methodology-block">
        <h5>Compute · 32k Prefill</h5>
        <span className="formula">2 × Total Params × 32 000 / 10 s</span>
        Prefill nutzt das gesamte Modell, nicht nur die aktiven Experten — daher der hohe Compute-Bedarf großer MoE-Modelle.
      </div>
      <div className="methodology-block">
        <h5>Durchsatz · 30 t/s</h5>
        <span className="formula">Aktiv-Params × 0,5 Byte (Q4) × 30 t/s</span>
        Generation ist memory-bandwidth-bound. Durchsatz skaliert linear mit der Speicher-Bandbreite des Systems.
      </div>
      <div className="methodology-block">
        <h5>Stromkosten</h5>
        <span className="formula">P · h/Tag · 30 / 1000 · €/kWh</span>
        Leistungsaufnahme im KI-Lastfaktor LF (default 0,6) gemittelt zwischen Idle und Peak.
      </div>
      <div className="methodology-block">
        <h5>Netto-TCO</h5>
        <span className="formula">Anschaffung + Strom − Wiederverkaufswert</span>
        Wiederverkauf linear interpoliert auf Basis publizierter Restwerte nach 3 Jahren.
      </div>
      <div className="methodology-block">
        <h5>Status-Kategorien</h5>
        <div style={{display: 'flex', flexDirection: 'column', gap: 4, marginTop: 4}}>
          <span><strong style={{color: 'var(--ok)'}}>Ideal</strong> · ≥30 t/s · Prefill ≤10 s</span>
          <span><strong style={{color: 'var(--usable)'}}>Brauchbar</strong> · ≥15 t/s · Prefill ≤30 s</span>
          <span><strong style={{color: 'var(--warn)'}}>Zu langsam</strong> · &lt;15 t/s</span>
          <span><strong style={{color: 'var(--err)'}}>OOM</strong> · VRAM unzureichend</span>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { ControlBar, KPICards, SectionHead, DetailPanel, HardwareCards, Methodology, formatParams });
</script>

<script type="text/babel">
/* The three main visualizations: matrix, scatter design-space, TCO chart. */

/* ============ Compatibility Matrix ============ */
function CompatibilityMatrix({ params, selection, setSelection, setTooltip }) {
  const cols = `260px repeat(${MODELS.length}, minmax(96px, 1fr))`;

  return (
    <div className="matrix-wrap">
      <div className="matrix" style={{ gridTemplateColumns: cols }}>
        {/* Top header row */}
        <div className="cell header-corner">
          <div style={{fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.12em', textTransform: 'uppercase', color: 'var(--text-tertiary)'}}>
            Hardware ↓ / Modell →
          </div>
        </div>
        {MODELS.map(m => {
          const isSelectedAxis = selection?.type === 'model' && selection.modelId === m.id ||
                                  selection?.type === 'cell' && selection.modelId === m.id;
          return (
            <div key={m.id}
              className={`cell header-col ${isSelectedAxis ? 'selected-axis' : ''}`}
              onClick={() => setSelection({ type: 'model', modelId: m.id })}>
              <div className="model-name">{m.name}</div>
              <div className="model-meta">{formatParams(m.total)} / {formatParams(m.active)} {m.dense ? 'dense' : 'MoE'}</div>
              <div className="model-meta">{m.vram} GB · {(m.context/1000).toLocaleString('de-DE')}k</div>
            </div>
          );
        })}

        {/* Body rows */}
        {HARDWARE.map(hw => {
          const isSelectedRow = selection?.type === 'hw' && selection.hwId === hw.id ||
                                selection?.type === 'cell' && selection.hwId === hw.id;
          return (
            <React.Fragment key={hw.id}>
              <div
                className={`cell header-row ${isSelectedRow ? 'selected-axis' : ''}`}
                onClick={() => setSelection({ type: 'hw', hwId: hw.id })}
                style={{borderLeft: `3px solid ${hw.color}`}}>
                <div className="hw-name">{hw.short}</div>
                <div className="hw-meta">{hw.vram} GB · {hw.tflops} TF · {hw.bandwidth.toLocaleString('de-DE')} GB/s</div>
              </div>
              {MODELS.map(m => {
                const fit = computeFit(hw, m);
                const isSel = selection?.type === 'cell' && selection.hwId === hw.id && selection.modelId === m.id;
                return (
                  <div key={m.id}
                    className={`cell cell-status-${fit.status}`}
                    style={isSel ? {outline: '2px solid var(--accent)', outlineOffset: -2, zIndex: 1} : {}}
                    onClick={() => setSelection({ type: 'cell', hwId: hw.id, modelId: m.id })}
                    onMouseEnter={(e) => setTooltip({
                      x: e.clientX, y: e.clientY,
                      title: `${hw.short} × ${m.name}`,
                      rows: [
                        ['Status', fit.label],
                        ['VRAM', `${m.vram} / ${hw.vram} GB`],
                        ['TPS', `${fit.tps.toFixed(1)} t/s`],
                        ['Prefill 32k', `${fit.prefillSec.toFixed(1)} s`]
                      ]
                    })}
                    onMouseMove={(e) => setTooltip(t => t ? {...t, x: e.clientX, y: e.clientY} : t)}
                    onMouseLeave={() => setTooltip(null)}>
                    {fit.status === 'oom' ? (
                      <>
                        <div className="cell-tps">OOM</div>
                        <div className="cell-prefill">{m.vram - hw.vram > 0 ? `+${m.vram - hw.vram} GB fehlen` : ''}</div>
                      </>
                    ) : (
                      <>
                        <div className="cell-tps">
                          {fit.tps.toFixed(0)}<span className="cell-tps-unit"> t/s</span>
                        </div>
                        <div className="cell-prefill">{fit.prefillSec < 100 ? fit.prefillSec.toFixed(1) : Math.round(fit.prefillSec)} s prefill</div>
                      </>
                    )}
                  </div>
                );
              })}
            </React.Fragment>
          );
        })}
      </div>

      <div className="legend">
        <div className="legend-item"><span className="legend-swatch ideal"></span>Ideal · ≥30 t/s · Prefill ≤10 s</div>
        <div className="legend-item"><span className="legend-swatch usable"></span>Brauchbar · ≥15 t/s</div>
        <div className="legend-item"><span className="legend-swatch slow"></span>Zu langsam</div>
        <div className="legend-item"><span className="legend-swatch oom"></span>VRAM unzureichend (OOM)</div>
      </div>
    </div>
  );
}

/* ============ Design-Space Scatter ============ */
function DesignSpaceChart({ selection, setSelection, setTooltip }) {
  // X axis: VRAM (GB) log scale, Y axis: bandwidth (GB/s) log scale
  // Models = bubbles, Hardware = rectangles from origin to (vram, bandwidth)
  const W = 1340, H = 520;
  const margin = { top: 24, right: 32, bottom: 48, left: 60 };
  const innerW = W - margin.left - margin.right;
  const innerH = H - margin.top - margin.bottom;

  // Domain: VRAM 16 .. 1024 GB, Bandwidth 100 .. 4000 GB/s
  const xMin = 16, xMax = 1024;
  const yMin = 100, yMax = 4000;
  const xScale = v => margin.left + (Math.log10(v) - Math.log10(xMin)) / (Math.log10(xMax) - Math.log10(xMin)) * innerW;
  const yScale = v => margin.top + innerH - (Math.log10(v) - Math.log10(yMin)) / (Math.log10(yMax) - Math.log10(yMin)) * innerH;

  const xTicks = [16, 32, 64, 128, 256, 512, 1024];
  const yTicks = [100, 200, 500, 1000, 2000, 4000];

  return (
    <div className="scatter-wrap">
      <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 14}}>
        <div className="tco-title">VRAM-Kapazität gegen Speicher-Bandbreite. Modelle sitzen <em>unterhalb-rechts</em> einer Hardware-Box, wenn beide Anforderungen erfüllt sind. Compute-Bedarf wird über die Modell-Punktgröße kodiert.</div>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="scatter-svg" preserveAspectRatio="xMidYMid meet">
        {/* Grid */}
        <g className="scatter-grid">
          {xTicks.map(t => <line key={'gx'+t} x1={xScale(t)} x2={xScale(t)} y1={margin.top} y2={H-margin.bottom} />)}
          {yTicks.map(t => <line key={'gy'+t} x1={margin.left} x2={W-margin.right} y1={yScale(t)} y2={yScale(t)} />)}
        </g>

        {/* Axes */}
        <g className="scatter-axis">
          <line x1={margin.left} y1={H-margin.bottom} x2={W-margin.right} y2={H-margin.bottom} />
          <line x1={margin.left} y1={margin.top} x2={margin.left} y2={H-margin.bottom} />
          {xTicks.map(t => (
            <text key={'tx'+t} x={xScale(t)} y={H-margin.bottom+18} textAnchor="middle">{t} GB</text>
          ))}
          {yTicks.map(t => (
            <text key={'ty'+t} x={margin.left-10} y={yScale(t)+3} textAnchor="end">{t.toLocaleString('de-DE')}</text>
          ))}
          <text x={W-margin.right} y={H-margin.bottom+38} textAnchor="end" style={{fontSize: 11, letterSpacing: '0.06em'}}>VRAM-KAPAZITÄT (GB, log)</text>
          <text transform={`rotate(-90 ${margin.left-44} ${margin.top+innerH/2})`} x={margin.left-44} y={margin.top+innerH/2} textAnchor="middle" style={{fontSize: 11, letterSpacing: '0.06em'}}>BANDBREITE (GB/s, log)</text>
        </g>

        {/* Hardware zones — rectangles from x=xMin to x=hw.vram, y=yMin to y=hw.bandwidth */}
        {HARDWARE.map((hw, i) => {
          const x0 = xScale(xMin);
          const x1 = xScale(Math.min(hw.vram, xMax));
          const y0 = yScale(Math.min(hw.bandwidth, yMax));
          const y1 = yScale(yMin);
          const isActive = selection?.type === 'hw' && selection.hwId === hw.id;
          return (
            <g key={hw.id}>
              <rect
                className={`hw-zone ${isActive ? 'active' : ''}`}
                x={x0} y={y0} width={x1-x0} height={y1-y0}
                fill={hw.color} stroke={hw.color}
                onClick={() => setSelection({type: 'hw', hwId: hw.id})}
                onMouseEnter={(e) => setTooltip({
                  x: e.clientX, y: e.clientY,
                  title: hw.name,
                  rows: [
                    ['VRAM', `${hw.vram} GB`],
                    ['Bandbreite', `${hw.bandwidth.toLocaleString('de-DE')} GB/s`],
                    ['Compute', `${hw.tflops} TFLOPS`]
                  ]
                })}
                onMouseMove={(e) => setTooltip(t => t ? {...t, x: e.clientX, y: e.clientY} : t)}
                onMouseLeave={() => setTooltip(null)}
              />
              {/* Label inside top-right corner */}
              <text className="hw-zone-label"
                x={x1 - 6} y={y0 + 14}
                textAnchor="end" fill={hw.color}>{hw.short}</text>
            </g>
          );
        })}

        {/* Models as dots */}
        {MODELS.map(m => {
          const x = xScale(Math.max(xMin, Math.min(xMax, m.vram)));
          const y = yScale(Math.max(yMin, Math.min(yMax, m.bandwidthNeed)));
          // Size based on compute (active params for bubble)
          const r = Math.max(5, Math.min(22, Math.sqrt(m.computeNeed) / 4));
          const isSel = selection?.type === 'model' && selection.modelId === m.id ||
                        selection?.type === 'cell' && selection.modelId === m.id;
          return (
            <g key={m.id}>
              <circle
                className="model-dot"
                cx={x} cy={y} r={r}
                fill={m.dense ? 'rgba(122,162,255,0.85)' : 'rgba(232,234,240,0.92)'}
                stroke={isSel ? 'var(--accent)' : '#0a0c10'}
                strokeWidth={isSel ? 2.5 : 1.5}
                onClick={() => setSelection({type: 'model', modelId: m.id})}
                onMouseEnter={(e) => setTooltip({
                  x: e.clientX, y: e.clientY,
                  title: m.name,
                  rows: [
                    ['Total / Aktiv', `${formatParams(m.total)} / ${formatParams(m.active)}`],
                    ['VRAM', `${m.vram} GB`],
                    ['Bandbreite', `${m.bandwidthNeed} GB/s`],
                    ['Compute', `${m.computeNeed.toLocaleString('de-DE')} TFLOPS`]
                  ]
                })}
                onMouseMove={(e) => setTooltip(t => t ? {...t, x: e.clientX, y: e.clientY} : t)}
                onMouseLeave={() => setTooltip(null)}
              />
              <text className="model-label"
                x={x + r + 4} y={y + 3}>{m.name}</text>
            </g>
          );
        })}

        {/* Legend annotation */}
        <g transform={`translate(${margin.left+12}, ${margin.top+10})`}>
          <rect x={0} y={0} width={210} height={56} fill="var(--bg-panel)" stroke="var(--border)" rx={3} />
          <circle cx={14} cy={16} r={5} fill="rgba(232,234,240,0.92)" stroke="#0a0c10" strokeWidth={1.5} />
          <text x={26} y={20} fontFamily="var(--font-sans)" fontSize="11" fill="var(--text-secondary)">MoE (Mixture-of-Experts)</text>
          <circle cx={14} cy={38} r={5} fill="rgba(122,162,255,0.85)" stroke="#0a0c10" strokeWidth={1.5} />
          <text x={26} y={42} fontFamily="var(--font-sans)" fontSize="11" fill="var(--text-secondary)">Dense</text>
        </g>
      </svg>
    </div>
  );
}

/* ============ TCO Chart ============ */
function TCOChart({ params, selection, setSelection, setTooltip }) {
  const W = 800, H = 360;
  const margin = { top: 20, right: 40, bottom: 60, left: 56 };
  const innerW = W - margin.left - margin.right;
  const innerH = H - margin.top - margin.bottom;

  const data = HARDWARE.map(hw => ({
    hw,
    ...tco(hw, params),
    energy: monthlyEnergy(hw, params) * 12 * params.years
  }));

  const maxStack = Math.max(...data.map(d => d.capex + d.energy));
  const yMax = Math.ceil(maxStack / 5000) * 5000;
  const yScale = v => margin.top + innerH - (v / yMax) * innerH;

  const barW = innerW / data.length * 0.62;
  const barX = (i) => margin.left + (innerW / data.length) * i + (innerW / data.length - barW) / 2;

  const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => t * yMax);

  return (
    <div className="tco-grid">
      <div className="tco-wrap">
        <div className="tco-title">
          Anschaffung + Strom über {params.years} {params.years === 1 ? 'Jahr' : 'Jahre'} · 
          <span style={{color: 'var(--ok)', marginLeft: 6}}>━ Wiederverkaufswert (Restwert linear)</span>
        </div>
        <svg viewBox={`0 0 ${W} ${H}`} className="tco-chart-svg" preserveAspectRatio="xMidYMid meet">
          <g className="scatter-axis">
            {yTicks.map(t => (
              <g key={t}>
                <line x1={margin.left} x2={W-margin.right} y1={yScale(t)} y2={yScale(t)} stroke="var(--border)" strokeDasharray={t===0?'':'2 3'} strokeWidth={0.5} />
                <text x={margin.left-10} y={yScale(t)+3} textAnchor="end">{(t/1000).toFixed(0)} k€</text>
              </g>
            ))}
          </g>

          {data.map((d, i) => {
            const isSel = selection?.type === 'hw' && selection.hwId === d.hw.id;
            const xc = barX(i);
            const yCapex = yScale(d.capex);
            const yEnergy = yScale(d.capex + d.energy);
            const yResidual = yScale(d.residual);
            return (
              <g key={d.hw.id}
                onClick={() => setSelection({type: 'hw', hwId: d.hw.id})}
                onMouseEnter={(e) => setTooltip({
                  x: e.clientX, y: e.clientY,
                  title: `${d.hw.short} · ${params.years}J TCO`,
                  rows: [
                    ['Anschaffung', `${d.capex.toLocaleString('de-DE')} €`],
                    ['Strom (Σ)', `${Math.round(d.energy).toLocaleString('de-DE')} €`],
                    ['Wiederverkauf', `−${Math.round(d.residual).toLocaleString('de-DE')} €`],
                    ['Netto', `${Math.round(d.net).toLocaleString('de-DE')} €`]
                  ]
                })}
                onMouseMove={(e) => setTooltip(t => t ? {...t, x: e.clientX, y: e.clientY} : t)}
                onMouseLeave={() => setTooltip(null)}
                style={{cursor: 'pointer'}}>
                {/* CAPEX */}
                <rect x={xc} y={yCapex} width={barW} height={yScale(0)-yCapex}
                  fill={d.hw.color} fillOpacity={isSel ? 0.95 : 0.55} />
                {/* Energy stack */}
                <rect x={xc} y={yEnergy} width={barW} height={yCapex-yEnergy}
                  fill={d.hw.color} fillOpacity={isSel ? 0.45 : 0.22}
                  stroke={d.hw.color} strokeWidth={1} strokeOpacity={0.4}
                  strokeDasharray="3 2" />
                {/* Residual marker */}
                <line x1={xc-4} x2={xc+barW+4} y1={yResidual} y2={yResidual}
                  stroke="var(--ok)" strokeWidth={2} />
                <text x={xc+barW+8} y={yResidual+3} fontSize="10" fill="var(--ok)" fontFamily="var(--font-mono)">
                  -{Math.round(d.residual/1000)}k
                </text>
                {/* Net label on top */}
                <text x={xc+barW/2} y={yEnergy-8}
                  textAnchor="middle"
                  fontSize="12" fontFamily="var(--font-mono)" fill="var(--text-primary)" fontWeight="500">
                  {(d.net/1000).toFixed(1)}k
                </text>
                {/* X axis label */}
                <text x={xc+barW/2} y={H-margin.bottom+18}
                  textAnchor="middle"
                  fontSize="10.5" fontFamily="var(--font-sans)" fill="var(--text-secondary)">
                  {d.hw.short.length > 14 ? d.hw.short.split(' ').slice(0,2).join(' ') : d.hw.short}
                </text>
                <text x={xc+barW/2} y={H-margin.bottom+32}
                  textAnchor="middle"
                  fontSize="10" fontFamily="var(--font-mono)" fill="var(--text-tertiary)">
                  {d.hw.vram}GB · {d.hw.tflops}TF
                </text>
              </g>
            );
          })}

          {/* Legend top right */}
          <g transform={`translate(${W-margin.right-180}, ${margin.top+4})`}>
            <rect x={0} y={0} width={20} height={10} fill="var(--accent)" fillOpacity={0.55} />
            <text x={26} y={9} fontSize="10.5" fill="var(--text-secondary)" fontFamily="var(--font-sans)">Anschaffung (CAPEX)</text>
            <rect x={0} y={18} width={20} height={10} fill="var(--accent)" fillOpacity={0.22} stroke="var(--accent)" strokeOpacity={0.4} strokeDasharray="3 2" />
            <text x={26} y={27} fontSize="10.5" fill="var(--text-secondary)" fontFamily="var(--font-sans)">Strom über Horizont</text>
          </g>
        </svg>
      </div>

      <div className="tco-wrap">
        <div className="tco-title">Ranking · Netto-TCO nach Wiederverkauf</div>
        <table className="tco-table">
          <thead>
            <tr>
              <th>Hardware</th>
              <th className="num">Strom/Mon</th>
              <th className="num">Σ Strom</th>
              <th className="num">Restwert</th>
              <th className="num">Netto</th>
            </tr>
          </thead>
          <tbody>
            {[...data].sort((a,b) => a.net - b.net).map(d => {
              const isSel = selection?.type === 'hw' && selection.hwId === d.hw.id;
              return (
                <tr key={d.hw.id}
                  className={isSel ? 'active' : ''}
                  onClick={() => setSelection({type: 'hw', hwId: d.hw.id})}
                  style={{cursor: 'pointer'}}>
                  <td>
                    <div style={{display:'flex', alignItems:'center', gap:8}}>
                      <div style={{width:3, height:18, background: d.hw.color, borderRadius:1}}></div>
                      <div>
                        <div style={{fontSize:12, fontWeight:500}}>{d.hw.short}</div>
                        <div style={{fontSize:10, color:'var(--text-tertiary)', fontFamily:'var(--font-mono)'}}>{d.hw.vram} GB · {d.hw.tflops} TF</div>
                      </div>
                    </div>
                  </td>
                  <td className="num">{(monthlyEnergy(d.hw, params)).toFixed(2)} €</td>
                  <td className="num">{Math.round(d.energy).toLocaleString('de-DE')} €</td>
                  <td className="num" style={{color:'var(--ok)'}}>−{Math.round(d.residual/1000).toLocaleString('de-DE')}k</td>
                  <td className="num" style={{fontWeight:600}}>{Math.round(d.net/1000).toLocaleString('de-DE')}k</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

Object.assign(window, { CompatibilityMatrix, DesignSpaceChart, TCOChart });
</script>

<script type="text/babel">
/* Main app — composes all sections. */

const { useState, useMemo, useEffect } = React;

const DEFAULT_PARAMS = {
  kWh: 0.315,
  hoursPerDay: 24,
  lf: 0.6,
  years: 3
};

function Tooltip({ tip }) {
  if (!tip) return null;
  const x = Math.min(tip.x + 14, window.innerWidth - 280);
  const y = Math.min(tip.y + 14, window.innerHeight - 140);
  return (
    <div className="tooltip" style={{left: x, top: y}}>
      <div className="tooltip-title">{tip.title}</div>
      {tip.rows.map(([k, v], i) => (
        <div key={i} className="tooltip-row">
          {k}: <span className="num">{v}</span>
        </div>
      ))}
    </div>
  );
}

function App() {
  const [params, setParams] = useState(DEFAULT_PARAMS);
  const [selection, setSelection] = useState(null);
  const [tooltip, setTooltip] = useState(null);

  // Auto-default selection on first load to highlight DGX Spark
  useEffect(() => {
    setSelection({ type: 'hw', hwId: 'dgx-spark' });
  }, []);

  return (
    <>
      <ControlBar params={params} setParams={setParams} />

      <KPICards params={params} selectedHw={selection?.hwId} />

      <div className="section">
        <SectionHead num="01"
          title="Kompatibilitäts-Matrix · Hardware × Modell"
          sub="Zelle = ein konkretes Setup. Farbe codiert die Leistungs-Klasse, Zahlen zeigen Token-Generierung und 32k-Prefill-Zeit. Klick öffnet die Bottleneck-Analyse." />
        <CompatibilityMatrix
          params={params}
          selection={selection}
          setSelection={setSelection}
          setTooltip={setTooltip} />
        <DetailPanel selection={selection} params={params} />
      </div>

      <div className="section">
        <SectionHead num="02"
          title="Design-Space · VRAM gegen Bandbreite"
          sub="Hardware-Boxen spannen den Lösungsraum auf. Modelle innerhalb einer Box können mit ≥30 t/s und passender VRAM-Kapazität bedient werden." />
        <DesignSpaceChart
          selection={selection}
          setSelection={setSelection}
          setTooltip={setTooltip} />
      </div>

      <div className="section">
        <SectionHead num="03"
          title="Wirtschaftlichkeit · Total Cost of Ownership"
          sub={`CAPEX + Strom über ${params.years} Jahre · grüne Linie zeigt Wiederverkaufswert · Werte oben am Balken sind Netto-TCO.`} />
        <TCOChart
          params={params}
          selection={selection}
          setSelection={setSelection}
          setTooltip={setTooltip} />
      </div>

      <div className="section">
        <SectionHead num="04"
          title="Hardware-Profile · Spezifikationen & Modell-Fit"
          sub="Pip-Streifen unter dem Namen zeigt die Eignung für die 9 Modelle (links → rechts in Reihenfolge der Matrix-Spalten)." />
        <HardwareCards
          params={params}
          activeHw={selection?.type === 'hw' ? selection.hwId : null}
          onSelect={setSelection} />
      </div>

      <div className="section">
        <SectionHead num="05"
          title="Methodik · Berechnungsformeln"
          sub="Transparenz über alle abgeleiteten Werte. Q4-Quantisierung für Gewichte, TurboQuant (TQ) für KV-Cache." />
        <Methodology />
      </div>

      <div className="footer">
        <div>KI-Hosting Hardware-Dashboard · Quellen: AMD, Apple, NVIDIA, Skywork, TechPowerUp · Stand Q4 2026</div>
        <div className="footer-meta">
          <span>9 Modelle</span>
          <span>6 Hardware-Systeme</span>
          <span>54 Kombinationen</span>
        </div>
      </div>

      <Tooltip tip={tooltip} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
